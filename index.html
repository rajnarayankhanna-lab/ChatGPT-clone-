<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT clone</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <style>
    body{
      margin: 0px ;
      background: black;
      color: white;
    }
    button{
      background: #222;
      color: white;
      border:1px solid #444;
    }
    .top-bar{
      height:60px;
      border:1px solid black;
      display: flex;
      gap:10px;
      align-items: center;
      
    }
    .chat-area{
      height:280px;
      border: 1px solid black;
      ooverflow-y: auto;
    }
    .input-area{
      height:60px;
      border:1px solid black;
      display:flex;
  align-items:center;
  gap:10px;
      }
    .name{
       color:#B3B8F0;
       border-radius:100px;
       padding:10px;
       display:flex;
       gap:10px;
       margin-left:15px;
    }
       
    .button{
      font-weight:200;
      width:40px;
    height:40px;
    border-radius:50%
    }
.blue{
    background: #47484C;
    color:white;
    padding:10px;
    width:65%;
  transition:0.2s ease;
  font-size:16px;
  border-radius:50px;
  outline:none;
}
.arrow{
  font-weight:200;
      width:40px;
    height:40px;
    border-radius:60%;
    background-color:#5278D5;
    color:white;
}
    .plus-menu{
      margin-left:15px;
    }
    
    .custom-menu {
  display: flex;
  flex-direction: column;
  gap: 5px; /* Lines ke beech ki jagah */
  width: 20px;
}

.line {
  height: 3px;
  background-color: white;
  border-radius: 3px;
}

.line:nth-child(2) {
  width: 70%; 
}
.none{
  border-radius: 20px;
  margin-left: 150px;
  padding:10px;
}
.user-message{
  background:#064EB1;
  color:white;
  padding:10px;
  margin:10px;
  border-radius:15px;
  width:fit-content;
  width:70%;
  margin-left:auto;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.plus-menu{
  margin-left:15px;
}


  </style>
</head>

<body
oncopy="return false"
oncut="return false"
onpaste="return false"
oncontextmenu="return false">
  <!---top area-->
  <div class="top-bar">
    <button class="button">
      <div class="custom-menu">
  <div class="line"></div>
  <div class="line"></div>
</div>
</button>

<!---Get plus-->

    </button>
    <button class="name"> ✦ Get Plus</button>
    <button class="none">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-circle-dashed-icon lucide-message-circle-dashed"><path d="M10.1 2.182a10 10 0 0 1 3.8 0"/><path d="M13.9 21.818a10 10 0 0 1-3.8 0"/><path d="M17.609 3.72a10 10 0 0 1 2.69 2.7"/><path d="M2.182 13.9a10 10 0 0 1 0-3.8"/><path d="M20.28 17.61a10 10 0 0 1-2.7 2.69"/><path d="M21.818 10.1a10 10 0 0 1 0 3.8"/><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69"/><path d="m6.163 21.117-2.906.85a1 1 0 0 1-1.236-1.169l.965-2.98"/></svg>
      </button>
  </div>
  
  
  <!----Chat area---->
  <div id="chat-area" class="chat-area"> </div>
  <div id="plus-menu"class="plus-menu">
  <p>
    <span class="material-symbols-outlined">image</span>
    Create image
  </p>

  <p>
    <span class="material-symbols-outlined">edit</span>
    write or edit
  </p>

  <p>
    <span class="material-symbols-outlined">travel_explore</span>
    Look something up
  </p>
</div>

  <!---Input area-->
  <div  class="input-area">
    <button id="button" class="button" 
    onclick="toggleMenu()">
    <span class="material-symbols-outlined">add</span>
  </button>
  
  <!---Text area--->
  
  <input id="message"class="blue" type="text" placeholder="Ask ChatGPT">
  
  <!---Arrow Send Button-->
  
  <button class="arrow"
  onclick="sendMessage()">
  <span class="material-symbols-outlined">
    arrow_upward
  </span>
  </button>
  
  <!---Mic--->
  <button class="button">
    <span class="material-symbols-outlined">
    mic
  </span>
  </button>
  </div>
</body>
<script src="script.js"></script>
</html>
